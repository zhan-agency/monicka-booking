[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monicka-booking"
version = "0.1.0"
description = "Accessible Persian clinic booking pages for Monicka API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "Django>=4.2,<6",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-django>=4.8,<5"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
monicka_booking = ["templates/**/*.html", "static/**/*", "migrations/*.py"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
